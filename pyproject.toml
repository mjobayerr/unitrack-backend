[project]
name = "unitrack-backend"
version = "0.1.0"
description = "UniTrack API + workers — FastAPI hub for university bus ticketing & live tracking"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "redis>=5.2",
    "elasticsearch[async]>=8.15,<9",
    # zoneinfo reads the *system* tz database, which Windows does not have and
    # python:*-slim images do not ship. Without this, resolving
    # settings.service_timezone raises ZoneInfoNotFoundError and every trip
    # start fails. Explicit dependency rather than a base-image assumption.
    "tzdata>=2024.1",
    # Server-to-server calls to SSLCommerz. A runtime dependency, not a test
    # one: app/core/sslcommerz.py imports it, so the API will not start without.
    "httpx>=0.28",
    # Renders the boarding QR server-side, for a student who has signal. The
    # offline path signs on-device instead; this is the online convenience and
    # the only way to test a scanner before the student app exists.
    "qrcode[pil]>=8.0",
    # Ed25519 for boarding QR signatures (spec §7.2). Each ticket gets a
    # keypair: the student's device signs, the helper verifies with the public
    # key from its manifest — so a stolen helper phone holds nothing forgeable.
    "cryptography>=44.0",
    # Starlette needs this to read a form body. The payment gateway returns the
    # student by POSTing form-encoded fields, so without it every settlement
    # raises "The `python-multipart` library must be installed".
    "python-multipart>=0.0.20",
    # Verification email. Async because it is sent from inside the event loop:
    # stdlib smtplib blocks, and a slow relay would stall every other request
    # the worker was serving, not just the registration that triggered it.
    "aiosmtplib>=3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    # tests/test_bus_api.py runs the API against an in-memory SQLite database
    # so it needs no Postgres. The async driver was never declared, so those
    # tests errored on a fresh checkout.
    "aiosqlite>=0.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic autogenerates these; don't style-gate generated migrations.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Depends()/Query() in argument defaults is the idiomatic FastAPI pattern.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
