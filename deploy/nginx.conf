# UniTrack edge — dev. TLS terminates upstream (Cloudflare or the prod nginx),
# so this listens on plain 80; see deploy/nginx.prod.conf for the real edge.

# Docker's embedded DNS, and it is not optional.
#
# This file used to declare `upstream unitrack_api { server api:8000; }`. nginx
# resolves the names in an `upstream` block **once, at startup**, and caches the
# address forever. `docker compose up -d --build api` — the ordinary way to ship
# a backend change — gives the api container a new IP, and nginx keeps dialling
# the old one: every request through the edge answers 502 until nginx is
# restarted too, with nothing in the api's own logs to explain it.
#
# Found exactly that way: a rebuilt api was healthy on its published port while
# the edge returned "connect() failed (111: Connection refused) ... upstream:
# 172.18.0.6:8000" for an api that had moved to 172.18.0.5.
#
# `valid=10s` re-resolves on that interval. Both production configs already had
# this; only dev did not, which is the stack the team restarts most.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Passing the target through a variable is the second half of the fix: with a
    # literal `proxy_pass http://api:8000` nginx still resolves at config load.
    # It also disables nginx's automatic URI forwarding, hence the explicit
    # $request_uri below.
    set $api_upstream http://api:8000;

    location / {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade — carries /ws/track/{route_id} (the live map feed).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
