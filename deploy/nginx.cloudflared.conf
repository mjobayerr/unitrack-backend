# nginx config for the Cloudflare Tunnel deployment.
#
# Topology: cloudflared -> nginx:80 -> api:8000
#
# TLS is terminated by Cloudflare; traffic on this leg is plain HTTP on the
# internal Docker network. This file must NOT be used if nginx is exposed
# directly to the internet without cloudflared in front.
#
# Rate limiting uses CF-Connecting-IP (the real visitor IP, set by Cloudflare
# and forwarded by cloudflared) rather than $remote_addr (which would be the
# cloudflared container's internal IP and would rate-limit everyone as one).
# This is safe because the only way to reach nginx is through our cloudflared
# container — an attacker cannot spoof CF-Connecting-IP from the outside.

map $http_cf_connecting_ip $real_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# auth_limit: login and register endpoints — tightly capped to slow brute-force.
# 5 req/min per IP = one attempt every 12 seconds; burst of 3 absorbs quick retries.
limit_req_zone $real_ip zone=auth_limit:10m rate=5r/m;

# api_limit: all other endpoints — generous for normal app usage.
limit_req_zone $real_ip zone=api_limit:10m rate=120r/m;

upstream unitrack_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # Block oversized bodies (GPS batches are small; large uploads = red flag).
    client_max_body_size 1m;

    # ── Security headers ────────────────────────────────────────────────────
    # These are set on every response, including error pages (always keyword).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS is managed by Cloudflare ("Always Use HTTPS" setting). Setting it
    # here would have no effect because clients only see Cloudflare's response.

    # ── Auth endpoints — tightly rate-limited ───────────────────────────────
    location ~ ^/auth/(login|register) {
        limit_req zone=auth_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://unitrack_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $real_ip;
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── Everything else ─────────────────────────────────────────────────────
    location / {
        limit_req zone=api_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://unitrack_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $real_ip;
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket upgrade for future /ws/* endpoints.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
