# Production edge — TLS termination at the origin.
#
# Topology: phone/browser --HTTPS--> Cloudflare --HTTPS--> here (443) --> api:8000
#
# Use Cloudflare SSL mode "Full (Strict)" with a Cloudflare Origin Certificate
# mounted at /etc/nginx/certs. Do NOT use "Flexible" — that leaves this hop
# (Cloudflare -> your VPS) in cleartext across the public internet, so login
# credentials and tokens travel unencrypted.

# ── Real client IP ──────────────────────────────────────────────────────────
# Behind Cloudflare, $remote_addr is a Cloudflare edge IP, not the visitor.
# Rate-limiting on that would bucket every user in a region into a handful of
# keys and throttle innocent traffic while barely slowing an attacker.
#
# These directives tell nginx to trust CF-Connecting-IP, but *only* when the
# connection actually came from a Cloudflare range — a request arriving from
# anywhere else keeps its real $remote_addr and cannot spoof the header.
#
# Refresh this list from https://www.cloudflare.com/ips/ periodically; a
# retired range left here is a hole, a new range missing only costs accuracy.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ── Rate limits ─────────────────────────────────────────────────────────────
# auth_limit: login and register — tightly capped to slow credential stuffing.
# 5 req/min per IP = one attempt every 12 s; burst of 3 absorbs quick retries.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# api_limit: everything else — generous for normal app usage. A helper phone
# posts a GPS batch every 5 s (12/min) and still has ten times the headroom.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;

upstream unitrack_api {
    server api:8000;
}

# Everything on 80 goes to HTTPS. Cloudflare already talks 443, so this only
# catches direct hits to the origin IP.
server {
    listen 80;
    server_name api.kodewithmj.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.kodewithmj.xyz;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # A phone posts small GPS batches; this is plenty and blocks oversized bodies.
    client_max_body_size 1m;

    # ── Security headers ────────────────────────────────────────────────────
    # `always` so they are set on error responses too, not just 2xx.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Auth endpoints — tightly rate-limited ───────────────────────────────
    # Listed before `location /` so credential endpoints get the strict zone.
    location ~ ^/auth/(login|register) {
        limit_req zone=auth_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://unitrack_api;
        proxy_set_header Host $host;
        # $remote_addr is the true visitor IP here — real_ip_header rewrote it
        # above, but only for connections from a Cloudflare range.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=api_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://unitrack_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for /ws/* (later phases). Cloudflare proxies WS on
        # the same proxied hostname, so no separate subdomain is needed.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
